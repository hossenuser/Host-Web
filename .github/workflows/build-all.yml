name: Build MH Apps Gallery (all platforms)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run desktop:win
      - uses: actions/upload-artifact@v4
        with: { name: MH-Apps-Gallery-Windows, path: release/*.exe }

  macos:
    name: macOS disk image (.dmg, Intel + Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run desktop:mac
      - uses: actions/upload-artifact@v4
        with: { name: MH-Apps-Gallery-macOS, path: release/*.dmg }

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - name: Generate native icons and splash from resources/
        run: npm run assets:native || echo "Icon generation skipped - default icon will be used"
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: MH-Apps-Gallery-Android, path: android/app/build/outputs/apk/debug/*.apk }

  ios:
    name: iOS build check (simulator, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx cap add ios
      - name: Generate native icons and splash from resources/
        run: npm run assets:native || echo "Icon generation skipped - default icon will be used"
      - run: npx cap sync ios
      - name: Compile for iOS Simulator
        run: |
          if [ -d ios/App/App.xcworkspace ]; then TARGET="-workspace ios/App/App.xcworkspace"; else TARGET="-project ios/App/App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      # A device-installable .ipa needs an Apple Developer account + signing certificate.
      # See docs/BUILD-ALL-DEVICES.md ("iPhone and iPad").

  pages:
    name: Publish the installable web app (PWA) with HTTPS
    # Runs only after you enable Pages (Settings > Pages > Source: GitHub Actions)
    # and add a repository variable ENABLE_PAGES = true (Settings > Secrets and variables > Actions > Variables).
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Attach installers to a GitHub Release (tags like v2.0.0)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
          name: MH Apps Gallery - latest build
          files: 'dist/**/*'
